<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light p-4 mb-5">
  <div class="container bg-white p-4 rounded form-cadastro">
      <h1 class="h3 mb-1">Cadastro de demandas</h1>
      <p class="text-muted mb-4">Complete com as informações da solicitação</p>

      <form>
        <!--Informações da demanda-->
        <fieldset class="border p-3 rounded mb-4">
            <legend class="float-none w-auto px-2 fs-6 fw-bold">Informações da Demanda</legend>

            <div class="mb-3">
                <label for="titulo" class="form-label">Título da demanda:</label>
                <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: Erro ao emitir relatório de vendas" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição:</label>
                <textarea name="descricao" id="descricao" class="form-control" rows="4" placeholder="Descreva detalhadamente o que você precisa..."></textarea>
            </div>
        </fieldset>

        <!--Classificação e Status-->
        <fieldset class="border p-3 rounded mb-4">
            <legend class="float-none w-auto px-2 fs-6 fw-bold">Classificação e Status</legend>
            <div class="mb-3">
                <label for="categoria" class="form-label">Categoria:</label>
                <select name="categoria" id="categoria" class="form-select">
                    <option value="">Selecione a categoria...</option>
                        <option value="tarefa">Tarefa</option>
                        <option value="defeito">Defeito</option>
                        <option value="melhoria">Melhoria</option>
                        <option value="documentacao">Documentação</option>
                </select>
            </div>

            <!--Prioridade-->
            <div class="mb-3">
                <label for="prioridade" class="form-label">Prioridade:</label>
                <select name="prioridade" id="prioridade" class="form-select">
                    <option value="">Selecione a prioridade...</option>
                    <option value="critica">Crítica</option>
                    <option value="alta">Alta</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                </select>
            </div>

            <!--Responsável-->
            <div class="mb-3">
                <label for="responsavel" class="form-label">Responsável:</label>
                <input type="text" id="responsavel" name="responsavel" class="form-control" placeholder="Ex: Mario Almeida ou Equipe de Suporte">
            </div>

            <!--Prazo-->
            <div class="mb-3">
                <label for="prazo" class="form-label">Prazo:</label>
                <input type="date" id="prazo" name="prazo" class="form-control">
            </div>

            <!--Status-->
            <div class="mb-3">
                <label for="status" class="form-label">Status:</label>
                <select name="status" id="status" class="form-select">
                    <option value="aberta">Aberta</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="em_revisao">Em revisão</option>
                    <option value="concluida">Concluída</option>
                    <option value="cancelada">Cancelada</option>
                </select>
            </div>
        </fieldset>

        <!--Botões-->
        <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn btn-primary">
                Cadastrar 
            </button>

            <button type="reset" class="btn btn-outline-secondary">
                Cancelar
            </button>
        </div>
      </form>
  </div>
</body>
</html>
