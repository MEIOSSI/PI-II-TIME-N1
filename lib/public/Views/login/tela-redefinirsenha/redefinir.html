<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="redefinir.css">
    <script src="redefinir.js" defer></script>
</head>
<body>
    <main>
         <form>
            <div class="divPai">
                <div class="logo">
                    <i class="bi bi-grid-fill"></i>
                </div>
                <div>
                    
                    <h1>Redefinir senha</h1>
                
                </div>
                <div class="txtentrar">

                    <p>Redefina sua senha.</p>

                </div>
                <div>

                    <label for="novasenha" class="form-label"><h2>Nova senha</h2></label><br>
                    
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="novasenha" placeholder="Digite sua nova senha">
                        <button class="btn btn-outline-secondary" type="button" id="togglesenha1"><i class="bi bi-eye-slash"></i></button>
                    </div>
                    <span class="error" id="erroNovasenha"></span>
                

                <div>

                    <label for="confirmanovasenha" class="form-label"><h2>Confirme sua nova senha</h2></label><br>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="confirmanovasenha" placeholder="Confirme sua nova senha">
                        <button class="btn btn-outline-secondary" type="button" id="togglesenha2"><i class="bi bi-eye-slash"></i></button>
                    </div>
                    <span class="error" id="erroConfirmasenha"></span>

                </div>

                <div id="botaoAlterar">

                    <button type="submit" class="btn btn-info" id="btnRedefinir">Redefinir senha</button>

                </div>
            </div>
        </form>
    </main>
</body>

</html>
