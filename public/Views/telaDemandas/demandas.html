<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demandas</title>
      <!-- Bootstrap via CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="style.css">

    <script defer src="api.js"></script>
    <script defer src="demandas.js"></script>
</head>
<body>
    <header class="p-3">        
        <div class="row">
            <div class="col-6 proj-header">
                <div class="d-flex">
                    <a href="../telaProjetos/projetos.html"><img src="../../icons/arrow-left-solid.png" alt="Voltar" class="icon-voltar"></a>
                    <p class="voltar-texto">Dashboard</p>
                </div>
                <h3 class="ms-4 titulo-projeto" id="nomeProjeto"><!--Nome do projeto--></h3>
            </div>
            <div class="col-6 container d-flex justify-content-end align-items-center itens">
                <div class="perfil">
                    <ul class="nav me-5 d-flex">
                        <li class="nav-item perfil-texto text-center">
                            <p id="nomeUsuario"><!--Usuário--></p><p id="perfilUsuario"><!--PERFIL--></p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="d-flex layout">
        <aside class="sidebar">
            <div class="row">
                <div class="col-12 col-md-9 pe-0 me-0">
                    <!--barra de pesquisa-->
                    <input type="search" class="form-control" placeholder="Pesquisar demandas" id="pesquisaDemandas">     
                </div>
                <div class="col-12 col-md-3">
                    <button type="button" class="btn btn-primary aplicar" id="btnPesquisarDemanda" onclick=pesquisarDemandas()><img src="../../icons/magnifying-glass-solid.png" alt="" width="25px"></button>
                </div>
            </div>
            <form action="">
                <h6 class="mb-3 mt-3">Filtros</h6>

                <div class="label">
                    <input class = "mt-3" type="checkbox" name="minhas-demandas" value="minhas-demandas" id="minhasDemandas">
                    <label class="mb-3" for="minhas-demandas">Apenas minhas demandas</label>
                </div>

                <p class="mb-3 pt-3 label">Prioridade</p>
                <div class="d-flex flex-column gap-2 mb-3 filtros">
                    <div><input type="radio" name="prioridade" value="CRITICA"> Crítica </div>
                    <div><input type="radio" name="prioridade" value="ALTA"> Alta </div>
                    <div><input type="radio" name="prioridade" value="MEDIA"> Média </div>
                    <div><input type="radio" name="prioridade" value="BAIXA"> Baixa </div>
                </div>

                <p class="mb-3 pt-3 label">Tipo</p>
                <div class="d-flex flex-column gap-2 mb-3 filtros">
                    <div><input type="radio" name="tipo" value="TAREFA"> Tarefa </div>
                    <div><input type="radio" name="tipo" value="DEFEITO"> Defeito </div>
                    <div><input type="radio" name="tipo" value="MELHORIA"> Melhoria </div>
                    <div><input type="radio" name="tipo" value="DOCUMENTACAO"> Documentação </div>
                </div>

                <div class="d-flex gap-2 mb-3 pt-3 botoes">
                    <button type="button" class="btn btn-outline-secondary limpar" onclick=limparFiltros()>Limpar Filtros</button>
                    <button type="button" class="btn btn-primary aplicar" onclick=aplicarFiltros()>Aplicar</button>       
                </div>
            </form>
        </aside>

        <main class="row d-flex flex-grow-1 ">
            <!--coluna em aberto-->
            <div class="col-12 col-md coluna-demanda">
                <section class="card shadow-sm coluna-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Aberta</p>
                    </div>
                    <!--card de demanda, será inserido conforme demandas são criadas apenas-->
                    <div class="card-body rounded-bottom" data-status="ABERTA">
                        <!--botão de nova demanda, apenas para lider e adm-->
                        <div id="botaodemanda"></div>
                    </div>
                </section>
            </div>

            <!--coluna em andamenmento-->
            <div class="col-12 col-md coluna-demanda">
                <section class="card shadow-sm coluna-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Em Andamento</p>
                    </div>
                    <div class="card-body rounded-bottom" data-status="EM ANDAMENTO">
                    </div>
                </section>
            </div>

            <!--coluna em revisão-->
            <div class="col-12 col-md coluna-demanda">
                <section class="card shadow-sm coluna-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Em Revisão</p>
                    </div>
                    <div class="card-body rounded-bottom" data-status="EM REVISAO">
                    </div>
                </section>
            </div>

            <!--coluna em concluida-->
            <div class="col-12 col-md coluna-demanda">
                <section class="card shadow-sm coluna-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Concluída</p>
                    </div>
                    <div class="card-body rounded-bottom" data-status="CONCLUIDA">
                    </div>
                </section>
            </div>

            <!--coluna em cancelada-->
            <div class="col-12 col-md coluna-demanda">
                <section class="card shadow-sm coluna-card coluna-cancelada">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Cancelada</p>
                    </div>
                    <div class="card-body rounded-bottom" data-status="CANCELADA">
                    </div>
                </section>
            </div>
        </main>        
    </div>
</body>
</html>
