<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="/Views/usuarios/style.css" rel="stylesheet">

</head>
<body>
      <!-- CABEÇALHO -->
    <header class="cabecalho">

        <div class="projeto">
            <a href="/view/projetos" class="voltar">

            <h2 id="nomeProjeto">Integrantes</h2>
        </div>

        <div class="acoes">
            <span id="quantidadeUsuarios">Carregando integrantes...</span>

    <!-- CONTEÚDO PRINCIPAL -->

        <h1>Pessoas envolvidas no projeto</h1>

        <p class="subtitulo">
            Equipe responsável pelo desenvolvimento e acompanhamento das demandas
        </p>


        <!-- LISTA DE PESSOAS -->
        <div id="mensagemUsuarios" role="status"></div>
        <section class="equipe" id="listaUsuarios"></section>

    </main>

</html>
