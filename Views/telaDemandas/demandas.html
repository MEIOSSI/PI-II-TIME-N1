<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demandas</title>
      <!-- Bootstrap via CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

  <!-- CSS próprio -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="p-3">        
        <div class="row">
            <div class="col-6 nom-prjeto">
                <a href="#"><-Todos os Projetos</a>
                <h3 class="ms-4 mt-3">Nome do Projeto</h3>
            </div>
            <div class="col-6 container d-flex justify-content-end align-items-center itens">
                <ul class="nav">
                    <li class="nav-item ">
                        <a class="nav-link btn btn-outline-light" href="#">Histórico de alterações</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light" href="#">Infos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light me-5" href="#">Infos</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <div class="d-flex">
        <aside class="sidebar">
            <input type="search" class="form-control" placeholder="Pesquisar demandas">
            <form action="">
                <h5 class="mb-3 mt-3">Filtros</h5>

                <div class="label">
                    <input class = "mt-3" type="checkbox" name="minhas-demandas" value="minhas-demandas">
                    <label class="mb-3" for="minhas-demandas">Apenas minhas demandas</label>
                </div>

                <p class="mb-3 pt-3 label">Prioridade</p>
                <div class="d-flex flex-column gap-2 mb-3 filtros">
                    <div><input type="radio" name="prioridade" value="critica"> Crítica </div>
                    <div><input type="radio" name="prioridade" value="alta"> Alta </div>
                    <div><input type="radio" name="prioridade" value="media"> Média </div>
                    <div><input type="radio" name="prioridade" value="baixa"> Baixa </div>
                </div>

                <p class="mb-3 pt-3 label">Tipo</p>
                <div class="d-flex flex-column gap-2 mb-3 filtros">
                    <div><input type="radio" name="tipo" value="tarefa"> Tarefa </div>
                    <div><input type="radio" name="tipo" value="defeito"> Defeito </div>
                    <div><input type="radio" name="tipo" value="melhoria"> Melhoria </div>
                    <div><input type="radio" name="tipo" value="documentacao"> Documentação </div>
                </div>

                <div class="d-flex gap-2 mb-3 pt-3 botoes">
                    <button type="button" class="btn btn-outline-secondary">Limpar Filtros</button>
                    <button type="button" class="btn btn-primary">Aplicar</button>       
                </div>
            </form>
        </aside>

        <main class="row d-flex flex-grow-1 ">
            <div class="col-12 col-md-3 coluna-demanda">
                <section class="card shadow-sm coluna-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <p class="titulo-demanda">Aberta</p>
                    </div>
                    <!--card de demanda, será inserido conforme demandas são criadas apenas-->
                    <div class="card-body rounded-bottom">
                        <article class="card mb-3 shadow-sm demanda-card">
                            <div class="card-body">
                                <div class="mb-3 nome-demanda">demanda de bug</div>
                                <div class="d-flex gap-2"><p class="prioridade">crítica </p><p>-</p><p class="tipo">Bug</p></div>
                                <p class="small text-muted mb-0">O acesso não funciona para novos usuários.</p>
                            </div>
                        </article>
                    </div>
                </section>
            
            </div>
        </main>        
    </div>
</body>
</html>
